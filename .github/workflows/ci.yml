name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build (frontend + API bundle)
        run: npm run build

  node-tests:
    name: Node (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests (vitest)
        run: npm run test

  python:
    name: Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [simulation, ai]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  python-tests:
    name: Python tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [simulation, ai, ingestion, documents]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest
        run: pytest

  e2e:
    name: E2E + perf smoke (MySQL)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/policy_twin
      APP_SECRET: ci-e2e-secret-not-for-production
      APP_ID: ci-e2e
      OWNER_UNION_ID: e2e-executive
      NODE_ENV: production
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: policy_twin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push schema
        run: npm run db:push

      - name: Seed pilot data
        run: npx tsx db/seed.ts

      - name: Seed e2e identities
        run: npx tsx tests/e2e/seed-users.ts

      # Data contract assertions (DM-2, DM-5) against the freshly seeded
      # database — dbt-style not-null/unique/referential/provenance/
      # freshness/seed-floor checks. The suite self-skips without
      # DATABASE_URL, so it runs here and not in the unit-test job.
      - name: Data contracts (dbt-style)
        run: npx vitest run api/tests/data-contracts.test.ts

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          PORT=3000 nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "server did not come up"; cat server.log; exit 1

      - name: E2E API suite
        run: BASE_URL=http://localhost:3000 node tests/e2e/e2e.mjs

      - name: Performance smoke (NFR thresholds, 30s)
        run: BASE_URL=http://localhost:3000 node tests/perf/local-bench.mjs --smoke

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: server.log

  security:
    name: Security (deps + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high severity threshold)
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            dockerfile: infra/docker/Dockerfile.app
          - name: simulation
            context: services/simulation
            dockerfile: services/simulation/Dockerfile
          - name: ai
            context: services/ai
            dockerfile: services/ai/Dockerfile
          - name: ingestion
            context: services/ingestion
            dockerfile: services/ingestion/Dockerfile
          - name: documents
            context: services/documents
            dockerfile: services/documents/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: policy-twin/${{ matrix.name }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [node, node-tests, python, python-tests, e2e, security, docker]
    steps:
      - name: Gate checklist
        run: |
          echo "RELEASE GATE — all of the following must be green (they are, or this job would not run):"
          echo "  [x] node typecheck + build"
          echo "  [x] node unit tests (vitest)"
          echo "  [x] python tests: simulation, ai, ingestion, documents"
          echo "  [x] e2e API suite + NFR perf smoke against MySQL"
          echo "  [x] security: npm audit (high) + gitleaks"
          echo "  [x] docker images build (app, simulation, ai, ingestion, documents)"
          echo "Pre-release evidence still required outside CI (docs/TESTING.md gates):"
          echo "  [ ] k6 full profiles on staging (tests/k6/)"
          echo "  [ ] dbt data contracts on staging data"
          echo "  [ ] model eval + prompt regression within deltas"
          echo "  [ ] simulation calibration report attached"
          echo "  [ ] staging canary bake window"

  # --------------------------------------------------------------------
  # Deploy / GitOps (gap 11). main-only, behind the release gate.
  # staging: build+push images, then kubectl apply -k overlays/staging.
  # prod:    separate job gated by a MANUAL-APPROVAL GitHub environment.
  # Real credentials come from GitHub secrets/environments — where a
  # secret is required the step is present but clearly marked; nothing is
  # faked (no-op echoes are annotated as awaiting credentials).
  # --------------------------------------------------------------------
  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [release-gate]
    environment:
      name: staging
      url: https://staging.policy-twin.example.gov
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Registry login — requires GHCR (GITHUB_TOKEN, default) or set
      # REGISTRY_USERNAME/REGISTRY_PASSWORD secrets for another registry.
      - name: Registry login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push service images
        run: |
          set -e
          for svc in app simulation ai ingestion documents; do
            case "$svc" in
              app) ctx="."; df="infra/docker/Dockerfile.app" ;;
              *)   ctx="services/$svc"; df="services/$svc/Dockerfile" ;;
            esac
            docker build -t "$REGISTRY/policy-twin-$svc:$IMAGE_TAG" \
              -f "$df" "$ctx"
            docker push "$REGISTRY/policy-twin-$svc:$IMAGE_TAG"
          done

      # Cluster credentials — place the staging kubeconfig in the
      # `staging` environment as secret KUBECONFIG_STAGING (base64 or raw
      # YAML). Until it exists this step reports honestly and exits 0 so
      # the pipeline shape is verifiable without a live cluster.
      - name: Apply staging overlay (kubectl -k)
        env:
          KUBECONFIG_STAGING: ${{ secrets.KUBECONFIG_STAGING }}
        run: |
          if [ -z "$KUBECONFIG_STAGING" ]; then
            echo "::warning::KUBECONFIG_STAGING not configured — image push done, cluster apply skipped (awaiting credentials)"
            exit 0
          fi
          echo "$KUBECONFIG_STAGING" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          # Pin images to this build, then apply the staging overlay.
          cd infra/k8s/overlays/staging
          for svc in app simulation ai ingestion documents; do
            kustomize edit set image \
              "policy-twin/$svc=$REGISTRY/policy-twin-$svc:$IMAGE_TAG" || true
          done
          kubectl apply -k .
          kubectl rollout status -n policy-twin deploy/app --timeout=300s

  deploy-prod:
    name: Deploy → production (manual approval)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    # The `production` GitHub environment is configured with REQUIRED
    # REVIEWERS — this job blocks for manual approval before any step runs.
    environment:
      name: production
      url: https://policy-twin.example.gov
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply production overlay (kubectl -k)
        env:
          KUBECONFIG_PROD: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          if [ -z "$KUBECONFIG_PROD" ]; then
            echo "::error::KUBECONFIG_PROD not configured — refusing to deploy to production"
            exit 1
          fi
          echo "$KUBECONFIG_PROD" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl apply -k infra/k8s/overlays/prod
          kubectl rollout status -n policy-twin deploy/app --timeout=600s
