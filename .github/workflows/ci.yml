name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build (frontend + API bundle)
        run: npm run build

  node-tests:
    name: Node (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests (vitest)
        run: npm run test

  python:
    name: Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [simulation, ai]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  python-tests:
    name: Python tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # services/documents does not exist yet; add it here when it lands.
        service: [simulation, ai, ingestion]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest
        run: pytest

  e2e:
    name: E2E + perf smoke (MySQL)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/policy_twin
      APP_SECRET: ci-e2e-secret-not-for-production
      APP_ID: ci-e2e
      OWNER_UNION_ID: e2e-executive
      NODE_ENV: production
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: policy_twin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push schema
        run: npm run db:push

      - name: Seed pilot data
        run: npx tsx db/seed.ts

      - name: Seed e2e identities
        run: npx tsx tests/e2e/seed-users.ts

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          PORT=3000 nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "server did not come up"; cat server.log; exit 1

      - name: E2E API suite
        run: BASE_URL=http://localhost:3000 node tests/e2e/e2e.mjs

      - name: Performance smoke (NFR thresholds, 30s)
        run: BASE_URL=http://localhost:3000 node tests/perf/local-bench.mjs --smoke

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: server.log

  security:
    name: Security (deps + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high severity threshold)
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            dockerfile: infra/docker/Dockerfile.app
          - name: simulation
            context: services/simulation
            dockerfile: services/simulation/Dockerfile
          - name: ai
            context: services/ai
            dockerfile: services/ai/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: policy-twin/${{ matrix.name }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [node, node-tests, python, python-tests, e2e, security, docker]
    steps:
      - name: Gate checklist
        run: |
          echo "RELEASE GATE — all of the following must be green (they are, or this job would not run):"
          echo "  [x] node typecheck + build"
          echo "  [x] node unit tests (vitest)"
          echo "  [x] python tests: simulation, ai, ingestion"
          echo "  [x] e2e API suite + NFR perf smoke against MySQL"
          echo "  [x] security: npm audit (high) + gitleaks"
          echo "  [x] docker images build (app, simulation, ai)"
          echo "Pre-release evidence still required outside CI (docs/TESTING.md gates):"
          echo "  [ ] k6 full profiles on staging (tests/k6/)"
          echo "  [ ] dbt data contracts on staging data"
          echo "  [ ] model eval + prompt regression within deltas"
          echo "  [ ] simulation calibration report attached"
          echo "  [ ] staging canary bake window"
