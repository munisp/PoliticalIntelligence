# Dapr state store over Redis (ADR-010, docs/DAPR.md).
# Used for idempotency keys, scheduler cursors, and connector checkpoints —
# NOT for canonical platform data (that stays in MySQL/PostGIS).
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: policy-twin-state
  namespace: policy-twin
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis:6379
    - name: redisPassword
      secretKeyRef:
        name: platform-secrets
        key: REDIS_PASSWORD
    - name: actorStateStore
      value: "false" # actors are out of scope (ADR-010)
    - name: enableTTL
      value: "true"
  auth:
    secretStore: policy-twin-secrets
scopes:
  - ingestion
  - simulation
  - documents
