# Dapr secret store — local environment variables, DEV ONLY (ADR-010).
# Staging/prod swap this for a Kubernetes-secret or external-secrets-backed
# component (see infra/k8s/base/external-secrets.yaml) with the same
# metadata.name so app code never changes.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: policy-twin-secrets
  namespace: policy-twin
spec:
  type: secretstores.local.env
  version: v1
  metadata:
    - name: nestedSeparator
      value: "."
scopes:
  - ingestion
  - simulation
  - documents
