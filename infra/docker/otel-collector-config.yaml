# OpenTelemetry Collector pipeline for the platform.
# Receives OTLP traces/metrics/logs from app (Node), simulation and ai (Python),
# exposes a Prometheus scrape endpoint, and forwards traces to a Jaeger/Tempo
# backend via OTLP when one is configured.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  attributes/redaction:
    actions:
      # Never export credentials or tokens in span attributes.
      - key: authorization
        action: delete
      - key: db.statement.parameters
        action: delete

exporters:
  # Metrics re-exposed for Prometheus to scrape at otel-collector:8889.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  # Traces/logging backend. Point this at Jaeger/Tempo in staging/prod;
  # the debug exporter keeps the dev stack self-contained.
  debug:
    verbosity: basic
  otlp/traces:
    endpoint: ${env:OTEL_TRACES_BACKEND_ENDPOINT:-localhost:4317}
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redaction, batch]
      exporters: [debug, otlp/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
