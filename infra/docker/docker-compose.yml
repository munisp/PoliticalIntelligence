# Full local/staging stack for the Jurisdiction Economic Intelligence & Policy Twin Platform.
# Usage:
#   cp infra/docker/.env.example .env
#   docker compose -f infra/docker/docker-compose.yml --env-file .env up --build
#
# Services:
#   app            Node 20 monolith: builds the React+Vite PWA and serves the Hono+tRPC API (port 3000)
#   simulation     FastAPI simulation/scenario microservice (port 8100)
#   ai             FastAPI AI/model-routing microservice (port 8200)
#   ingestion      FastAPI ingestion connectors + loader (port 8300)
#   documents      FastAPI document/OCR/legal-NLP/AKN pipeline (port 8400)
#   mysql          MySQL 8.x — Drizzle ORM operational store
#   minio (+init)  S3-compatible object storage for documents/lakehouse staging
#   neo4j          Knowledge graph (entities, laws, relationships)
#   opensearch     Full-text + vector search (single-node, security disabled for dev)
#   postgis        Geospatial store (wards, LGAs, facilities, GRID3 layers)
#   keycloak       OIDC identity provider (dev mode, realm import placeholder)
#   redpanda       Kafka-compatible event backbone (single broker)
#   prometheus     Metrics scrape
#   grafana        Dashboards (provisioned from infra/monitoring/grafana)
#   otel-collector Traces/metrics/logs pipeline

name: policy-twin

networks:
  platform:
    driver: bridge

volumes:
  documents-artifacts:
  ingestion-artifacts:
  mysql-data:
  minio-data:
  neo4j-data:
  opensearch-data:
  postgis-data:
  redpanda-data:
  prometheus-data:
  grafana-data:
  trino-data:
  vllm-cache:

services:
  # API gateway (API-9). Default SERVICES_MODE=monolith: serves the full
  # in-process route table (tRPC + REST /v1) exactly as before. With
  # SERVICES_MODE=micro the gateway forwards /v1/* and /api/trpc/* to the
  # per-domain services below (see "Domain services (API-9 micro mode)").
  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.app
    image: policy-twin/app:local
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # monolith (default, fully runnable) | micro (forward to domain services)
      SERVICES_MODE: ${SERVICES_MODE:-monolith}
      SERVICE_URL_JURISDICTIONS: http://jurisdictions:3001
      SERVICE_URL_OPPORTUNITIES: http://opportunities:3002
      SERVICE_URL_SCENARIOS: http://scenarios:3003
      SERVICE_URL_LEGISLATION: http://legislation:3004
      SERVICE_URL_DOCUMENTS_GATEWAY: http://documents-gateway:3005
      SERVICE_URL_BRIEFS: http://briefs:3006
      SERVICE_URL_ADMIN: http://admin:3007
      SERVICE_URL_OPS: http://ops:3008
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      DATABASE_URL: mysql://${MYSQL_USER:-policytwin}:${MYSQL_PASSWORD:-policytwin}@mysql:3306/${MYSQL_DATABASE:-policytwin}
      SIMULATION_SERVICE_URL: http://simulation:8100
      AI_SERVICE_URL: http://ai:8200
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${MINIO_BUCKET:-policy-twin}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-policytwin}
      OPENSEARCH_URL: http://opensearch:9200
      POSTGIS_URL: postgres://${POSTGIS_USER:-policytwin}:${POSTGIS_PASSWORD:-policytwin}@postgis:5432/${POSTGIS_DB:-geo}
      KAFKA_BROKERS: redpanda:9092
      # Ingestion service + shared loader key (feat-data-loader).
      INGESTION_BASE_URL: http://ingestion:8300
      LOADER_API_KEY: ${LOADER_API_KEY:-policytwin-loader-dev}
      # Document & legal processing service (spec §18); the gateway falls
      # back to its local processor when this is unreachable.
      DOCUMENTS_BASE_URL: http://documents:8400
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-policy-twin}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-policy-twin-app}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      postgis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      keycloak:
        condition: service_started
    
        simulation:
        condition: service_started
      ai:
        condition: service_started
      ingestion:
        condition: service_started
      documents:
        condition: service_started
    networks:
      platform:
        # Back-compat alias: other services still reach the gateway as
        # http://app:3000 (PLATFORM_API_URL etc.).
        aliases: [app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped


