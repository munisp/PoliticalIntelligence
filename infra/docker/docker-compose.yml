        condition: service_healthy
    networks: [platform]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8300/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Document & legal processing service (spec §18): upload -> OCR ->
  # legal NLP -> Akoma Ntoso. The app gateway talks to it via
  # DOCUMENTS_BASE_URL and degrades to a local fallback processor when it
  # is down (processing_mode="fallback" on the register response).
  documents:
    build:
      context: ../../services/documents
    image: policy-twin/documents:local
    ports:
      - "${DOCUMENTS_PORT:-8400}:8400"
    environment:
      PORT: "8400"
      DOCUMENTS_ARTIFACTS_DIR: /srv/artifacts/documents
      DOCUMENTS_S3_ENDPOINT_URL: http://minio:9000
      DOCUMENTS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      DOCUMENTS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DOCUMENTS_S3_BUCKET: ${MINIO_BUCKET:-policy-twin}
      KAFKA_BROKERS: redpanda:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - documents-artifacts:/srv/artifacts/documents
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks: [platform]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8400/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Refresh-cadence scheduler (SR-1): runs each connector on its own
  # interval with jitter; last-run state persisted in the artifacts volume.
  # Not started by default — enable with:
  #   docker compose --profile scheduler up ingestion-scheduler
  ingestion-scheduler:
    build:
      context: ../../services/ingestion
    image: policy-twin/ingestion:local
    profiles: ["scheduler"]
    command: ["python", "-m", "app.scheduler"]
    environment:
      SCHEDULER_ENABLED: "1"
      SCHEDULER_TICK_S: ${SCHEDULER_TICK_S:-60}
      # Optional JSON override: {"worldbank": 86400, "nbs_bulletin": 604800}
      SCHEDULER_CADENCE: ${SCHEDULER_CADENCE:-}
      KAFKA_BROKERS: redpanda:9092
      PLATFORM_API_URL: http://app:3000
      LOADER_API_KEY: ${LOADER_API_KEY:-policytwin-loader-dev}
      INGESTION_ARTIFACTS_DIR: /srv/artifacts/ingestion
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ingestion-artifacts:/srv/artifacts/ingestion
    depends_on:
      api-gateway:
        condition: service_started
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    networks: [platform]
    restart: unless-stopped

  ai:
    build:
      context: ../../services/ai
    image: policy-twin/ai:local
    ports:
      - "${AI_PORT:-8200}:8200"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-policytwin}:${MYSQL_PASSWORD:-policytwin}@mysql:3306/${MYSQL_DATABASE:-policytwin}
      OPENSEARCH_URL: http://opensearch:9200
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-policytwin}
      KAFKA_BROKERS: redpanda:9092
      # Model tier endpoints (vLLM / Ray Serve). Defaults point at in-process dev stubs.
      MODEL_DEFAULT_TIER: ${MODEL_DEFAULT_TIER:-qwen3-dev}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://localhost:8000/v1}
      # AI-7: set LLM_TRANSPORT=ray to route via Ray Serve (RAY_SERVE_URL)
      LLM_TRANSPORT: ${LLM_TRANSPORT:-vllm}
      RAY_SERVE_URL: ${RAY_SERVE_URL:-http://localhost:8001}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks: [platform]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8200/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-policytwin}
      MYSQL_USER: ${MYSQL_USER:-policytwin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-policytwin}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [platform]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks: [platform]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set download local/$${MINIO_BUCKET}/public || true;
      echo 'minio-init: bucket ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-policy-twin}
    networks: [platform]
    restart: "no"

  neo4j:
    image: neo4j:5
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-policytwin}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-unused-security-disabled}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  postgis:
    image: postgis/postgis:16-3.4
    ports:
      - "${POSTGIS_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGIS_USER:-policytwin}
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD:-policytwin}
      POSTGRES_DB: ${POSTGIS_DB:-geo}
    volumes:
      - postgis-data:/var/lib/postgresql/data
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak/realm-import:/opt/keycloak/data/import:ro
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    ports:
      - "${REDPANDA_PORT:-9092}:9092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot topic provisioning (scripts/kafka-topics.sh): creates the
  # 10-topic event catalog + DLQs, idempotently, then exits.
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/kafka-topics.sh", "redpanda:9092"]
    volumes:
      - ../../scripts:/scripts:ro
    environment:
      PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      REPLICAS: ${KAFKA_TOPIC_REPLICAS:-1}
    networks: [platform]
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [platform]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Blackbox prober for the availability SLI (probe_success per target).
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    ports:
      - "${BLACKBOX_PORT:-9115}:9115"
    volumes:
      - ../monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    networks: [platform]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9115/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    networks: [platform]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # ------------------------------------------------------------------
  # vLLM OpenAI-compatible serving tier (GPU profile — not started by
  # default; enable with: docker compose --profile gpu up vllm).
  # Works out of the box: point the ai service at it via
  #   VLLM_BASE_URL=http://vllm:8000  (router + circuit breakers take over)
  # Swap VLLM_MODEL for per-tier deployments (see docs/LLM.md).
  # ------------------------------------------------------------------
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen3-32B}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL:-0.90}
    environment:
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-32B}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT:-1}
              capabilities: [gpu]
    networks: [platform]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  # DM-4/DM-5: Trino analytical fabric over the Iceberg lakehouse (MinIO
  # warehouse). Catalogs mounted from infra/docker/trino/catalog. Smoke
  # query: docs/LAKEHOUSE.md.
  # ING-8: Dagster orchestration control plane (optional profile). Wraps the
  # 8 connectors as jobs with per-pack schedules + a new-source sensor
  # (services/ingestion/app/orchestration/dagster_defs.py). Enable with:
  #   docker compose --profile orchestration up dagster
  # UI on http://localhost:8301
  dagster:
    build:
      context: ../../services/ingestion
    image: policy-twin/ingestion:local
    profiles: ["orchestration"]
    command: >
      /bin/sh -c "pip install --no-cache-dir dagster dagster-webserver &&
      DAGSTER_HOME=/app dagster dev -m app.orchestration.dagster_defs
      -h 0.0.0.0 -p 8301"
    environment:
      KAFKA_BROKERS: redpanda:9092
      PLATFORM_API_URL: http://app:3000
      LOADER_API_KEY: ${LOADER_API_KEY:-policytwin-loader-dev}
      INGESTION_ARTIFACTS_DIR: /srv/artifacts/ingestion
      INGESTION_SOURCES_DIR: /srv/artifacts/ingestion/sources
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${DAGSTER_PORT:-8301}:8301"
    volumes:
      - ingestion-artifacts:/srv/artifacts/ingestion
    depends_on:
      api-gateway:
        condition: service_started
      redpanda:
        condition: service_healthy
    networks: [platform]
    restart: unless-stopped

  trino:
    image: trinodb/trino:latest
    ports:
      - "${TRINO_PORT:-8080}:8080"
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - trino-data:/var/lib/trino
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      prometheus:
        condition: service_started
    networks: [platform]
    restart: unless-stopped
