# DM-4 / DM-5: Iceberg lakehouse catalog (ADR-005/006).
# Tables are exported by services/ingestion/app/lakehouse:
#   python -m app.lakehouse export --entity sector_metrics
# 'hadoop' catalog = no Hive metastore needed (dev/local); switch to
# iceberg.catalog.type=rest + iceberg.rest-catalog.uri for a shared catalog
# (Nessie/Tabular) in staging/prod.
connector.name=iceberg
iceberg.catalog.type=hadoop
iceberg.catalog.warehouse=s3://policy-twin/lakehouse
iceberg.file-format=PARQUET
# MinIO / S3-compatible storage (values injected from compose env):
fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT_URL}
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
s3.region=us-east-1
