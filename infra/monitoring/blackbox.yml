# blackbox_exporter modules — HTTP health probing for the uptime SLI.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []  # default: any 2xx
      method: GET
      fail_if_body_not_matches_regexp: []
      preferred_ip_protocol: ip4
