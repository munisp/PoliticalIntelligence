# Prometheus scrape configuration for the Policy Twin platform.
# Mounted by infra/docker/docker-compose.yml; for Kubernetes, convert these
# jobs to ServiceMonitors / pod annotations.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: policy-twin

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Node API (Hono+tRPC) — serves /metrics on the app port.
  - job_name: app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]
        labels:
          service: app
          tier: api

  # FastAPI simulation service.
  - job_name: simulation
    metrics_path: /metrics
    static_configs:
      - targets: ["simulation:8100"]
        labels:
          service: simulation
          tier: worker

  # FastAPI AI service (model router, retrieval pipeline).
  - job_name: ai
    metrics_path: /metrics
    static_configs:
      - targets: ["ai:8200"]
        labels:
          service: ai
          tier: worker

  # FastAPI ingestion service (connectors, loader).
  - job_name: ingestion
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestion:8300"]
        labels:
          service: ingestion
          tier: worker

  # FastAPI documents/legal service (OCR, LexNLP, AKN).
  - job_name: documents
    metrics_path: /metrics
    static_configs:
      - targets: ["documents:8400"]
        labels:
          service: documents
          tier: worker

  # OpenTelemetry Collector re-exposes app metrics in Prometheus format.
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector
          tier: observability

  # Redpanda admin metrics (queue depth, consumer lag for event topics).
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
        labels:
          service: redpanda
          tier: messaging

  # Blackbox uptime probing (availability SLI, TEST-3): app /healthz plus
  # every service health endpoint. probe_success feeds the
  # UptimeProbeFailing alert and the 99.5% availability SLI windows
  # documented in docs/NFR-EVIDENCE.md.
  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://app:3000/healthz
          - http://simulation:8100/healthz
          - http://ai:8200/healthz
          - http://ingestion:8300/health
          - http://documents:8400/health
        labels:
          tier: health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
          tier: observability
