# ENV-2: weighted canary routing in staging. The primary Ingress
# (base/ingress.yaml) keeps 100% by default; this canary Ingress mirrors its
# rules with nginx canary annotations sending CANARY_WEIGHT% to the
# app-canary pods (same Service selector trick requires a dedicated Service,
# below). Promote by raising the weight to 100 then rolling the main
# Deployment to the candidate image; abort by setting the weight to 0.
apiVersion: v1
kind: Service
metadata:
  name: app-canary
  namespace: policy-twin
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: policy-twin
spec:
  selector:
    app.kubernetes.io/name: app
    track: canary
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-canary
  namespace: policy-twin
  labels:
    app.kubernetes.io/part-of: policy-twin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/canary: "true"
    # Weight is patched by CI/CD during a canary release (default 10%).
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  ingressClassName: nginx
  rules:
    - host: policy-twin.stg.example.gov.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-canary
                port:
                  name: http
  tls:
    - hosts:
        - policy-twin.stg.example.gov.ng
      secretName: policy-twin-tls
