# Canary deployment for the app in staging: a small slice of pods running the
# candidate image behind the same Service selector. Traffic split is managed by
# the ingress controller (e.g. nginx canary annotations) or a service mesh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-canary
  namespace: policy-twin
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: policy-twin
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
      track: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/part-of: policy-twin
        track: canary
      annotations:
        # nginx.ingress.kubernetes.io/canary: "true"  # enable when wiring weighted canary
        prometheus.io/scrape: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/munisp/politicalintelligence/app:canary
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: RELEASE_TRACK
              value: "canary"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
