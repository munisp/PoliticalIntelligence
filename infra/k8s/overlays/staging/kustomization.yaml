apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: policy-twin
resources:
  - ../../base
  - ../../model-serving
  - canary.yaml
  - canary-ingress.yaml
nameSuffix: -stg
images:
  - name: ghcr.io/munisp/politicalintelligence/app
    newTag: staging
  - name: ghcr.io/munisp/politicalintelligence/simulation
    newTag: staging
  - name: ghcr.io/munisp/politicalintelligence/ai
    newTag: staging
patches:
  # Staging: production-like sizing; Qwen3-32B default tier; canary app deploy.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: platform-config
      data:
        LOG_LEVEL: "info"
        DATA_MODE: "production"
        MODEL_DEFAULT_TIER: "qwen3-32b"
        # Gap #27: enable OTel tracing on staging. The collector endpoint
        # comes from the base platform-config
        # (otel-collector.observability.svc.cluster.local:4317); the SDK
        # noops gracefully if the collector or optional OTel packages are
        # unavailable (api/utils/otel.ts, services/_shared/metrics.py).
        OTEL_SDK_ENABLED: "true"
    target:
      kind: ConfigMap
      name: platform-config
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: policy-twin.stg.example.gov.ng
      - op: replace
        path: /spec/tls/0/hosts/0
        value: policy-twin.stg.example.gov.ng
    target:
      kind: Ingress
