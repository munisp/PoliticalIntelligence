# SEC-5: cert-manager issuers for TLS in transit. Requires cert-manager
# (helm install cert-manager jetstack/cert-manager --set crds.enabled=true).
# The app Ingress (base/ingress.yaml) requests its certificate via the
# cert-manager.io/cluster-issuer annotation; staging/prod overlays patch the
# host. Internal service-to-service traffic can use the selfsigned issuer
# with the cainjector for a full mTLS mesh later.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: policy-twin
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform-ops@example.gov.ng
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  labels:
    app.kubernetes.io/part-of: policy-twin
spec:
  selfSigned: {}
---
# Internal CA for service-to-service TLS (MinIO/PostGIS/etc. certs).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: policy-twin-internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: policy-twin-internal-ca
  secretName: policy-twin-internal-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: policy-twin-internal-ca
