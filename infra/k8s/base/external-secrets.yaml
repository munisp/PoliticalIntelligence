# SEC-5: Vault-backed secrets via the External Secrets Operator (replaces
# hand-managed secrets-template.yaml in staging/prod). Requires ESO
# (helm install external-secrets external-secrets/external-secrets) and a
# Vault KV v2 mount `secret/` with path `policy-twin/platform` holding the
# keys listed below. Kubernetes auth role `policy-twin` binds the app's
# service account.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault
  labels:
    app.kubernetes.io/part-of: policy-twin
spec:
  provider:
    vault:
      server: "https://vault.security.svc.cluster.local:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: policy-twin
          serviceAccountRef:
            name: policy-twin
            namespace: policy-twin
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-secrets
  namespace: policy-twin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: platform-secrets          # consumed by every Deployment envFrom
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: {key: policy-twin/platform, property: DATABASE_URL}
    - secretKey: NEO4J_PASSWORD
      remoteRef: {key: policy-twin/platform, property: NEO4J_PASSWORD}
    - secretKey: S3_ACCESS_KEY
      remoteRef: {key: policy-twin/platform, property: S3_ACCESS_KEY}
    - secretKey: S3_SECRET_KEY
      remoteRef: {key: policy-twin/platform, property: S3_SECRET_KEY}
    - secretKey: LOADER_API_KEY
      remoteRef: {key: policy-twin/platform, property: LOADER_API_KEY}
    - secretKey: KIMI_CLIENT_SECRET
      remoteRef: {key: policy-twin/platform, property: KIMI_CLIENT_SECRET}
