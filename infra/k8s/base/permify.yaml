# Permify ReBAC authorization service (feat-mw-edge-authz). Postgres backend
# reuses the platform postgis cluster (separate `permify` database); the
# connection string comes from Vault via ESO (platform-secrets →
# PERMIFY_DATABASE_URI). The app checks dataset reads against Permify when
# PERMIFY_URL is set (platform-config), with circuit-breaker fallback to ABAC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permify
  namespace: policy-twin
  labels:
    app.kubernetes.io/name: permify
    app.kubernetes.io/part-of: policy-twin
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: permify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: permify
        app.kubernetes.io/part-of: policy-twin
      annotations:
        prometheus.io/scrape: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: permify
          image: permify/permify:v1.2.9
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --database-engine=postgres
            - --database-uri=$(PERMIFY_DATABASE_URI)
          envFrom:
            - secretRef:
                name: platform-secrets
                optional: true
          ports:
            - name: http
              containerPort: 3476
            - name: grpc
              containerPort: 3478
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: permify
  namespace: policy-twin
  labels:
    app.kubernetes.io/name: permify
    app.kubernetes.io/part-of: policy-twin
spec:
  selector:
    app.kubernetes.io/name: permify
  ports:
    - name: http
      port: 3476
      targetPort: http
    - name: grpc
      port: 3478
      targetPort: grpc
