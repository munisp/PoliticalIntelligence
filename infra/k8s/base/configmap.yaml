# Shared non-sensitive configuration. Overlay kustomizations patch values
# that differ per environment (model tier, data mode, feature flags).
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: policy-twin
  labels:
    app.kubernetes.io/part-of: policy-twin
data:
  LOG_LEVEL: "info"
  API_VERSION: "v1"
  # qwen3-dev | qwen3-32b | qwen3-235b-a22b | deepseek-r1
  MODEL_DEFAULT_TIER: "qwen3-32b"
  # synthetic | production
  DATA_MODE: "production"
  S3_BUCKET: "policy-twin"
  KAFKA_BROKERS: "redpanda.eventing.svc.cluster.local:9092"
  OPENSEARCH_URL: "http://opensearch.search.svc.cluster.local:9200"
  NEO4J_URI: "bolt://neo4j.graph.svc.cluster.local:7687"
  POSTGIS_URL: "postgres://postgis.geo.svc.cluster.local:5432/geo"
  KEYCLOAK_URL: "https://idp.example.gov.ng"
  KEYCLOAK_REALM: "policy-twin"
  KEYCLOAK_CLIENT_ID: "policy-twin-app"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
