# Temporal durable-workflow stack (ADR-010, docs/TEMPORAL.md).
# Dev-grade single replica: Temporal server (auto-setup against an external
# Postgres — point TEMPORAL_DB_* at any reachable postgres:16; the compose
# stack uses a dedicated temporal-db container) + Temporal UI.
# NOT production-HA: prod needs multi-replica server roles (frontend/history/
# matching/worker) and a highly-available persistence layer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: policy-twin
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: policy-twin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/part-of: policy-twin
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.25
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 7233
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: TEMPORAL_DB_HOST
                  optional: true
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: TEMPORAL_DB_USER
                  optional: true
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: TEMPORAL_DB_PASSWORD
                  optional: true
            - name: DBNAME
              value: temporal
            - name: VISIBILITY_DBNAME
              value: temporal_visibility
            - name: ENABLE_ES
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: policy-twin
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: policy-twin
spec:
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: policy-twin
  labels:
    app.kubernetes.io/name: temporal-ui
    app.kubernetes.io/part-of: policy-twin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-ui
        app.kubernetes.io/part-of: policy-twin
    spec:
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.31
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: policy-twin
  labels:
    app.kubernetes.io/name: temporal-ui
    app.kubernetes.io/part-of: policy-twin
spec:
  selector:
    app.kubernetes.io/name: temporal-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
